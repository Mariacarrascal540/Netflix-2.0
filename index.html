<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body {
            --primary: #6200ee;
            --secondary: #29b6f6;
            margin: 0px;
        }

        * {
            font-family: 'Roboto', sans-serif;
        }

        button {
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            height: 20px;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 8px 0 8px;
        }

        div#main {
            padding: 10px;
        }

        input {
            margin-bottom: 5px;
            margin-top: 2px;
            padding: 4px;
            font-size: 12px;
        }

        h1 {
            background: var(--primary);
            color: white;
            font-weight: 300;
            text-transform: uppercase;
            font-size: 20px;
            margin: 0px;
            padding: 15px;
        }

        h2 {
            margin-block-start: 0px;
            margin-block-end: 10px;
            font-size: 20px;
            color: var(--primary);
        }

        button:hover {
            background: var(--primary);
            color: white;
        }

        button:disabled,
        button:disabled:hover {
            opacity: 0.5;
            background: white;
            color: var(--primary);
            cursor: not-allowed;
        }

        div.actions {
            margin-top: 10px;
        }

        div.movie {
            display: inline-block;
            width: auto;
            padding: 10px;
            box-shadow: 2px 2px 7px #ccc;
            margin: 5px;
        }

        div.movie div.movie-img {
            width: 200px;
            height: auto;
            min-height: 200px;
            cursor: pointer;
        }

        div.movie div.movie-img img {
            width: 100%;
            height: auto;
        }

        div.movie div.title {
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 200px;
            white-space: nowrap;
        }

        div.field {
            color: var(--primary);
            text-transform: uppercase;
            font-size: 12px;
        }

        div.movie {
            vertical-align: top;
        }

        div.movie div.overview {
            width: 200px;
            height: 80px;
            overflow: hidden;
            font-size: 11px;
            color: #555;
            margin-top: 5px;

        }
    </style>

    <script src="config.js"></script>
    <script type="text/javascript">

        // MODELO

        let initial_movies = [
            { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
            { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
            { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
        ];

        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);


        // VISTAS
        const indexView = (movies) => {
            let i = 0;
            let view = "";

            while (i < movies.length) {
                view += `
                <div class="movie">
                   <div class="movie-img">
                        <img data-my-id="${i}" src="${movies[i].thumbnail}" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                       ${movies[i].title || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                        <button class="show" data-my-id="${i}">view</button>
                        <button class="edit" data-my-id="${i}">edit</button>
                        <button class="delete" data-my-id="${i}">delete</button>

                    </div>
                </div>\n`;
                i = i + 1;
            };

            view += `<div class="actions">
                <button class="new">add</button>
                <button class="reset">reset</button>
                <button class="search-view">search TMDb</button>                    
            </div>`;

            return view;
        };


        const editView = (i, movie) => {
            return `<h2>Edit Movie </h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title" 
                        value="${movie.title}">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director" 
                        value="${movie.director}">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL" 
                        value="${movie.thumbnail}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">
                        Update
                    </button>
                    <button class="index">
                        Back
                    </button>
                </div>
               `;
        }


        const showView = (movie) => {
            return `
             <p>
             The movie <b>${movie.title}</b> directed by <b>${movie.director}</b>
             </p>
             <div class="actions">
                <button class="index">Back</button>
             </div>`;
        }


        const newView = () => {
            return `<h2>Create Movie</h2>
                <div class="field">
                Title <br>
                <input type="text" id="title" placeholder="Title">
                </div>
                <div class="field">
                Director <br>
                <input type="text" id="director" placeholder="Director">
                </div>
                <div class="field">
                Thumbnail <br>
                <input type="text" id="thumbnail" placeholder="Thumbnail URL">
                </div>
                <div class="actions">
                    <button class="create">Create </button>
                    <button class="index">Back</button>
                </div>`;
        }

        const searchView = () => {
            return `<h2>Search Movies in TMDb</h2>
                <div class="field">
                Movie title <br>
                <input type="text" id="query" class="search-input" placeholder="Ex: Interstellar">
                </div>
                <div id="search-message"></div>
                <div class="actions">
                    <button class="search">Search</button>
                    <button class="index">Back</button>
                </div>
                <div id="results"></div>`;
        }

        const resultsView = (results) => {
            let i = 0;
            let view = "";

            while (i < results.length) {
                let movie = results[i];

                // Póster: si la película no tiene, usamos la imagen por defecto
                let poster = 'files/noimage.png';
                if (movie.poster_path) {
                    poster = `https://image.tmdb.org/t/p/w200${movie.poster_path}`;
                }

                view += `
                <div class="movie">
                    <div class="movie-img">
                        <img src="${poster}"/>
                    </div>
                    <div class="title">${movie.title}</div>
                    <div class="field">${movie.release_date || 'No date'}</div>
                    <div class="overview">${movie.overview || 'No synopsis available.'}</div>
                    <div class="actions">
                        <button class="add-from-api" data-my-id="${i}">add</button>
                    </div>
                </div>\n`;
                i = i + 1;
            }

            return view;
        };




        // CONTROLADORES
        let lastResults = [];
        const indexContr = () => {
            let my_movies = JSON.parse(localStorage.my_movies);
            document.getElementById('main').innerHTML = indexView(my_movies);
        };


        const showContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = showView(movie);
        };

        const newContr = () => {
            document.getElementById('main').innerHTML = newView();

        };

        const createContr = () => {
            let my_movies = JSON.parse(localStorage.my_movies);
            let new_movie = {
                title: document.getElementById('title').value,
                director: document.getElementById('director').value,
                thumbnail: document.getElementById('thumbnail').value
            };
            my_movies.push(new_movie);
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };


        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title = document.getElementById('title').value;
            my_movies[i].director = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };


        const deleteContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            if (confirm(`Delete ${my_movies[i].title}?`)) {
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };


        const resetContr = () => {
            localStorage.my_movies = JSON.stringify(initial_movies);
            indexContr();
        };

        const searchViewContr = () => {
            document.getElementById('main').innerHTML = searchView();
        };

        const getToken = () => {
            // En local: el token viene de config.js
            if (typeof TMDB_TOKEN !== 'undefined') return TMDB_TOKEN;

            // En la web publicada: se pide una vez y se guarda en el navegador
            if (!localStorage.tmdb_token) {
                localStorage.tmdb_token = prompt('Introduce tu API Read Access Token de TMDb:');
            }
            return localStorage.tmdb_token;
        };

        const searchContr = async (query) => {
            const message = document.getElementById('search-message');
            query = query.trim();

            try {
                // 1. VALIDAR el término de búsqueda
                if (query === '') throw 'Please enter a movie title.';

                const invalid = ['<', '>', '&', '#', '%'];
                for (let c of invalid) {
                    if (query.includes(c)) throw `The character ${c} is not allowed.`;
                }

                message.innerHTML = 'Searching...';
                document.getElementById('results').innerHTML = '';

                // 2. PETICIÓN GET a la API (con la clave en la cabecera)
                let response = await fetch(`https://api.themoviedb.org/3/search/movie?query=${query}&language=es-ES`, {
                    method: 'GET',
                    headers: {
                        accept: 'application/json',
                        Authorization: `Bearer ${getToken()}`
                    }
                });

                // 3. COMPROBAR el código de estado HTTP
                if (response.status === 401) {
                    delete localStorage.tmdb_token;
                    throw 'Invalid API key. Try again to enter a new one.';
        }       if (response.status !== 200) throw `TMDb error: ${response.status}`;

                // 4. PROCESAR la respuesta JSON
                let data = await response.json();
                lastResults = data.results;
                console.log(lastResults);

                if (lastResults.length === 0) {
                    message.innerHTML = `No movies found for "${query}".`;
                } else {
                    message.innerHTML = `${lastResults.length} movies found.`;
                    document.getElementById('results').innerHTML = resultsView(lastResults);                }

                } catch (e) {
                    // 5. GESTIONAR errores (los nuestros y los de red)
                    if (e instanceof TypeError) {
                        message.innerHTML = 'Error: could not connect to TMDb. Check your internet connection.';
                    } else {
                        message.innerHTML = `Error: ${e}`;
                    }
                }
        };

        const addFromAPIContr = async (movie, button) => {
            const message = document.getElementById('search-message');

            // Deshabilitar el botón para que no se pulse varias veces
            button.disabled = true;
            button.innerHTML = 'adding...';

            try {
                // 1. VALIDAR los datos de la película
                if (!movie || !movie.title) throw 'Invalid movie data.';

                // 2. EVITAR DUPLICADOS: recorremos nuestras películas
                let my_movies = JSON.parse(localStorage.my_movies);
                let i = 0;
                while (i < my_movies.length) {
                    let same = false;
                    if (my_movies[i].id) {
                        // Película que vino de TMDb: comparamos el id
                        same = my_movies[i].id === movie.id;
                    } else {
                        // Película creada a mano (no tiene id): comparamos el título
                        same = my_movies[i].title === movie.title;
                    }
                    if (same) throw `"${movie.title}" is already in your list.`;
                    i = i + 1;
                }

                // 3. PEDIR EL DIRECTOR a la API (segunda petición GET)
                let director = 'Unknown';
                let response = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/credits`, {
                    method: 'GET',
                    headers: {
                        accept: 'application/json',
                        Authorization: `Bearer ${getToken()}`
                    }
                });
                if (response.status === 200) {
                    let credits = await response.json();
                    let j = 0;
                    while (j < credits.crew.length) {
                        if (credits.crew[j].job === 'Director') {
                            director = credits.crew[j].name;
                            break;
                        }
                        j = j + 1;
                    }
                }

                // 4. GUARDAR con la misma estructura que las películas manuales
                let thumbnail = 'files/noimage.png';
                if (movie.poster_path) {
                    thumbnail = `https://image.tmdb.org/t/p/w200${movie.poster_path}`;
                }

                my_movies.push({ id: movie.id, title: movie.title, director: director, thumbnail: thumbnail });
                localStorage.my_movies = JSON.stringify(my_movies);

                // 5. CONFIRMAR al usuario
                message.innerHTML = `"${movie.title}" added to your list!`;
                button.innerHTML = 'added';

            } catch (e) {
                message.innerHTML = `Error: ${e}`;
                button.disabled = false;
                button.innerHTML = 'add';
            }
        };


        // ROUTER
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);

        document.addEventListener('click', ev => {
            if (matchEvent(ev, '.index')) indexContr();
            else if (matchEvent(ev, '.edit')) editContr(myId(ev));
            else if (matchEvent(ev, '.update')) updateContr(myId(ev));
            else if (matchEvent(ev, '.show')) showContr(myId(ev));
            else if (matchEvent(ev, '.new')) newContr();
            else if (matchEvent(ev, '.create')) createContr();
            else if (matchEvent(ev, '.delete')) deleteContr(myId(ev));
            else if (matchEvent(ev, '.reset')) resetContr();
            else if (matchEvent(ev, '.search-view')) searchViewContr();
            else if (matchEvent(ev, '.search')) searchContr(document.getElementById('query').value);
            else if (matchEvent(ev, '.add-from-api')) addFromAPIContr(lastResults[myId(ev)], ev.target);
        })

        document.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' && matchEvent(ev, '.search-input')) {
                searchContr(ev.target.value);
            }
        });


        // ARRANQUE       
        document.addEventListener('DOMContentLoaded', indexContr);
    </script>
</head>

<body>

    <h1>My Favourite Movies</h1>
    <div id="main"> <!-- The view is included here --> </div>


</body>

</html>
